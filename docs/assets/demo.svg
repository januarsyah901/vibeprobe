<text x="24" y="89" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#8b949e" xml:space="preserve">Scanning http://localhost:4010/ (read-only, localhost only)...</tspan></text>
<text x="24" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#8b949e" xml:space="preserve">Mapped 1 page(s), 1 script(s), 2 endpoint(s).</tspan></text>
<text x="24" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#c9d1d9" xml:space="preserve"></tspan></text>
<text x="24" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ff7b72" xml:space="preserve">[CRITICAL] </tspan><tspan fill="#c9d1d9" xml:space="preserve">Stripe secret key is sent to every visitor's browser</tspan><tspan fill="#8b949e" xml:space="preserve">  SEC-01</tspan></text>
<text x="24" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ff7b72" xml:space="preserve">[CRITICAL] </tspan><tspan fill="#c9d1d9" xml:space="preserve">Environment file (.env) can be downloaded by anyone</tspan><tspan fill="#8b949e" xml:space="preserve">  SEC-06</tspan></text>
<text x="24" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ffa657" xml:space="preserve">[HIGH]     </tspan><tspan fill="#c9d1d9" xml:space="preserve">/api/users returns data to anyone, no login needed</tspan><tspan fill="#8b949e" xml:space="preserve">  SEC-03</tspan></text>
<text x="24" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ffa657" xml:space="preserve">[HIGH]     </tspan><tspan fill="#c9d1d9" xml:space="preserve">/admin opens without logging in</tspan><tspan fill="#8b949e" xml:space="preserve">  SEC-04</tspan></text>
<text x="24" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ffa657" xml:space="preserve">[HIGH]     </tspan><tspan fill="#c9d1d9" xml:space="preserve">Any website can read responses for a logged-in user</tspan><tspan fill="#8b949e" xml:space="preserve">  SEC-08</tspan></text>
<text x="24" y="257" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#e3b341" xml:space="preserve">[MEDIUM]   </tspan><tspan fill="#c9d1d9" xml:space="preserve">The "session" cookie is missing HttpOnly, SameSite</tspan><tspan fill="#8b949e" xml:space="preserve">  SEC-10</tspan></text>
<text x="24" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#e3b341" xml:space="preserve">[MEDIUM]   </tspan><tspan fill="#c9d1d9" xml:space="preserve">Error pages reveal how your server is built</tspan><tspan fill="#8b949e" xml:space="preserve">  SEC-07</tspan></text>
