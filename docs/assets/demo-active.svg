<svg xmlns="http://www.w3.org/2000/svg" width="860" height="483" viewBox="0 0 860 483" role="img" aria-label="Terminal demo of vibeprobe active mode finding SQL injection, template injection and more in a demo app">
<rect width="100%" height="100%" rx="12" fill="#0d1117"/>
<rect width="860" height="38" rx="12" fill="#161b22"/><rect y="26" width="860" height="12" fill="#161b22"/>
<circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="42" cy="19" r="6" fill="#ffbd2e"/><circle cx="62" cy="19" r="6" fill="#27c93f"/>
<text x="430" y="24" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" text-anchor="middle">vibeprobe --active</text>
<text x="24" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#7ee787" xml:space="preserve">$ </tspan><tspan fill="#c9d1d9" xml:space="preserve">npx vibeprobe http://localhost:4010 --active full --yes</tspan></text>
<text x="24" y="89" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#8b949e" xml:space="preserve">Scanning http://localhost:4010/ (active mode full, localhost only)...</tspan></text>
<text x="24" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#8b949e" xml:space="preserve">Mapped 2 page(s), 1 script(s), 8 endpoint(s).</tspan></text>
<text x="24" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#8b949e" xml:space="preserve">   ... read-only checks first ...</tspan></text>
<text x="24" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#c9d1d9" xml:space="preserve"></tspan></text>
<text x="24" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#8b949e" xml:space="preserve">Active mode (full): sending test payloads to http://localhost:4010...</tspan></text>
<text x="24" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#c9d1d9" xml:space="preserve"></tspan></text>
<text x="24" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ff7b72" xml:space="preserve">[CRITICAL] </tspan><tspan fill="#c9d1d9" xml:space="preserve">The "id" input on /api/items breaks the database query</tspan><tspan fill="#8b949e" xml:space="preserve">  ACT-02</tspan></text>
<text x="24" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ff7b72" xml:space="preserve">[CRITICAL] </tspan><tspan fill="#c9d1d9" xml:space="preserve">/api/login can be logged into without knowing a password</tspan><tspan fill="#8b949e" xml:space="preserve">  ACT-08</tspan></text>
<text x="24" y="257" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ff7b72" xml:space="preserve">[CRITICAL] </tspan><tspan fill="#c9d1d9" xml:space="preserve">The "name" input on /greet is run as template code</tspan><tspan fill="#8b949e" xml:space="preserve">  ACT-09</tspan></text>
<text x="24" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ff7b72" xml:space="preserve">[CRITICAL] </tspan><tspan fill="#c9d1d9" xml:space="preserve">The "url" input on /api/fetch makes your server fetch any address</tspan><tspan fill="#8b949e" xml:space="preserve">  ACT-10</tspan></text>
<text x="24" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ffa657" xml:space="preserve">[HIGH]     </tspan><tspan fill="#c9d1d9" xml:space="preserve">The "q" input on /search is shown back without escaping</tspan><tspan fill="#8b949e" xml:space="preserve">  ACT-01</tspan></text>
<text x="24" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ffa657" xml:space="preserve">[HIGH]     </tspan><tspan fill="#c9d1d9" xml:space="preserve">/api/profile accepts PUT requests from anyone, no login needed</tspan><tspan fill="#8b949e" xml:space="preserve">  ACT-06</tspan></text>
<text x="24" y="341" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ffa657" xml:space="preserve">[HIGH]     </tspan><tspan fill="#c9d1d9" xml:space="preserve">/api/v1/admin exists and answers with data, no login needed</tspan><tspan fill="#8b949e" xml:space="preserve">  ACT-12</tspan></text>
<text x="24" y="362" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#ffa657" xml:space="preserve">[HIGH]     </tspan><tspan fill="#c9d1d9" xml:space="preserve">/api/profile accepts fields it should never take from a visitor ("role")</tspan><tspan fill="#8b949e" xml:space="preserve">  ACT-07</tspan></text>
<text x="24" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#8b949e" xml:space="preserve">   ...</tspan></text>
<text x="24" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#c9d1d9" xml:space="preserve"></tspan></text>
<text x="24" y="425" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#c9d1d9" xml:space="preserve">43 findings: 14 critical, 15 high, 13 medium, 1 low (+1 low-confidence to review)</tspan></text>
<text x="24" y="446" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#7ee787" xml:space="preserve">Report: vibeprobe-report/report.html  (includes every request that was sent)</tspan></text>
</svg>