name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. If this is a **security** problem in vibeprobe itself (scope escape, non-read-only request, unmasked secret), please use private reporting instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command, and the framework of your app (Next.js, Vite, ...). Do not paste real secrets.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: vibeprobe version or commit
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
